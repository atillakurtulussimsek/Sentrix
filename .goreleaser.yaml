# GoReleaser v2 — builds binaries, archives, .deb/.rpm packages and checksums.
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: sentrix

before:
  hooks:
    - go mod tidy

builds:
  - id: sentrix-agent
    main: ./cmd/sentrix-agent
    binary: sentrix-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/atillakurtulussimsek/Sentrix/internal/version.Version={{.Version}}
      - -X github.com/atillakurtulussimsek/Sentrix/internal/version.Commit={{.ShortCommit}}
      - -X github.com/atillakurtulussimsek/Sentrix/internal/version.Date={{.Date}}
  - id: sentrix-server
    main: ./cmd/sentrix-server
    binary: sentrix-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
  - id: sentrix-cli
    main: ./cmd/sentrix
    binary: sentrix
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  - id: server
    ids: [sentrix-server]
    name_template: "sentrix-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, NOTICE, README.md, CHANGELOG.md, deploy/systemd/sentrix-server.service, deploy/nfpm/server.yaml]
  - id: agent-binary
    ids: [sentrix-agent]
    formats: [binary]
    name_template: "sentrix-agent-{{ .Os }}-{{ .Arch }}"
  - id: cli
    ids: [sentrix-cli]
    name_template: "sentrix-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: agent
    package_name: sentrix-agent
    ids: [sentrix-agent]
    vendor: Varkhe Digital
    homepage: https://github.com/atillakurtulussimsek/Sentrix
    maintainer: Varkhe Digital
    description: Sentrix agent — server health, inventory and typed patch actions.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: deploy/systemd/sentrix-agent.service
        dst: /lib/systemd/system/sentrix-agent.service
      - src: deploy/nfpm/agent.yaml
        dst: /etc/sentrix/agent.yaml
        type: config|noreplace
        file_info: {mode: 0600}
    scripts:
      postinstall: deploy/nfpm/postinstall-agent.sh
      preremove: deploy/nfpm/preremove.sh
  - id: server
    package_name: sentrix-server
    ids: [sentrix-server, sentrix-cli]
    vendor: Varkhe Digital
    homepage: https://github.com/atillakurtulussimsek/Sentrix
    maintainer: Varkhe Digital
    description: Sentrix server — self-hosted server health, CVE and patch management.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: deploy/systemd/sentrix-server.service
        dst: /lib/systemd/system/sentrix-server.service
      - src: deploy/nfpm/server.yaml
        dst: /etc/sentrix/server.yaml
        type: config|noreplace
        file_info: {mode: 0640}
    scripts:
      postinstall: deploy/nfpm/postinstall-server.sh
      preremove: deploy/nfpm/preremove.sh

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: true   # releases are reviewed and published manually
  prerelease: auto
