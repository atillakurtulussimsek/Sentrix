{{define "title"}}Welcome{{end}}
{{define "content"}}
<div class="w-full max-w-lg">
  <div class="mb-6 text-center">
    <h1 class="text-2xl font-semibold tracking-tight">Welcome to Sentrix</h1>
    <p class="mt-1 text-sm text-zinc-500">Create the first administrator account.</p>
  </div>
  <form method="post" action="/setup" class="card space-y-4 p-6">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{with .Data.Error}}<p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300">{{.}}</p>{{end}}
    <label class="block"><span class="label">Admin username</span><input name="username" required autofocus class="input mt-1" value="{{.Data.Username}}" autocomplete="username"></label>
    <label class="block"><span class="label">Password (min. 10 characters)</span><input name="password" type="password" required minlength="10" class="input mt-1" autocomplete="new-password"></label>
    <label class="block"><span class="label">Confirm password</span><input name="password2" type="password" required minlength="10" class="input mt-1" autocomplete="new-password"></label>
    <div class="rounded-md border border-amber-300 bg-amber-50 p-4 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-100">
      <p class="font-semibold">Disclaimer</p>
      <p class="mt-1">{{t "disclaimer"}}</p>
      <label class="mt-3 flex items-start gap-2"><input type="checkbox" name="accept" value="1" required class="mt-0.5"> <span>I have read and accept this disclaimer.</span></label>
    </div>
    <button class="btn-primary w-full">Create account and continue</button>
  </form>
</div>
{{end}}
