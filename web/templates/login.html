{{define "title"}}{{t "login.title"}}{{end}}
{{define "content"}}
<div class="w-full max-w-sm">
  <div class="mb-8 flex flex-col items-center gap-3">
    <svg viewBox="0 0 32 32" class="h-11 w-11"><rect width="32" height="32" rx="8" class="fill-teal-600"/><path d="M9 20.5c1.6 1.4 3.9 2.2 6.6 2.2 3.6 0 6.1-1.7 6.1-4.4 0-2.5-1.9-3.5-5.3-4.2-2.6-.5-3.4-1-3.4-2 0-1 1-1.6 2.6-1.6 1.7 0 3.1.6 4.2 1.6l1.9-2.4c-1.5-1.3-3.6-2-6-2-3.4 0-5.9 1.8-5.9 4.5 0 2.6 2 3.6 5.2 4.2 2.6.5 3.5 1 3.5 2 0 1.1-1.1 1.7-2.9 1.7-2 0-3.6-.7-4.8-1.9z" fill="#fff"/></svg>
    <h1 class="text-xl font-semibold tracking-tight">{{if .Data.MFA}}{{t "mfa.title"}}{{else}}{{t "login.title"}}{{end}}</h1>
  </div>
  <form method="post" action="{{if .Data.MFA}}/login/mfa{{else}}/login{{end}}" class="card space-y-4 p-6">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{with .Data.Error}}<p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-950/50 dark:text-red-300">{{.}}</p>{{end}}
    {{if .Data.MFA}}
    <label class="block"><span class="label">{{t "mfa.code"}}</span>
      <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required autofocus class="input mt-1 tracking-widest"></label>
    {{else}}
    <label class="block"><span class="label">{{t "login.username"}}</span>
      <input name="username" autocomplete="username" required autofocus class="input mt-1" value="{{.Data.Username}}"></label>
    <label class="block"><span class="label">{{t "login.password"}}</span>
      <input name="password" type="password" autocomplete="current-password" required class="input mt-1"></label>
    <input type="hidden" name="next" value="{{.Data.Next}}">
    {{end}}
    <button class="btn-primary w-full">{{t "login.submit"}}</button>
  </form>
</div>
{{end}}
