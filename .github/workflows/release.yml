name: release
# Runs only when a version tag is pushed. Produces a *draft* GitHub release that a
# maintainer reviews and publishes manually, and pushes the container image.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Agent self-update: sign the exact binaries GoReleaser uploaded and attach the
      # manifests. Fails (and so marks the release incomplete) without the signing key.
      - name: Sign agent binaries
        env:
          SENTRIX_RELEASE_SIGNING_KEY: ${{ secrets.SENTRIX_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for arch in amd64 arm64; do
            bin=$(ls dist/sentrix-agent_linux_${arch}_*/sentrix-agent)
            go run ./tools/signagent -version "$GITHUB_REF_NAME" -name "sentrix-agent-linux-$arch" -in "$bin" -out "dist/sentrix-agent-linux-$arch.sig.json"
          done
          gh release upload "$GITHUB_REF_NAME" dist/sentrix-agent-linux-*.sig.json --clobber
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/sentrix:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/sentrix:latest
