name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make race
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: make build-linux

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: Linux acceptance (enrol, presence, collectors, rollups, RSS)
        run: sudo -E env "PATH=$PATH" test/acceptance/linux-local.sh

  inventory-containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-linux
      - name: Inventory matches native tools (Debian, Ubuntu, Rocky, Alpine)
        run: test/acceptance/inventory-containers.sh
