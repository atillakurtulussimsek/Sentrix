name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make race
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: make build-linux

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - name: Linux acceptance (enrol, presence, collectors, rollups, RSS)
        run: sudo -E env "PATH=$PATH" test/acceptance/linux-local.sh
      - name: Disk threshold alert → one webhook, no repeat, resolve (M7)
        run: sudo -E env "PATH=$PATH" test/acceptance/alert-disk.sh

  inventory-containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-linux
      - name: Inventory matches native tools (Debian, Ubuntu, Rocky, Alpine)
        run: test/acceptance/inventory-containers.sh

  vuln-container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-linux
      - name: Known-vulnerable package detected, disappears after upgrade (live feeds)
        run: test/acceptance/vuln-container.sh

  patch-containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-linux
      - name: Security-only plan on Debian + Rocky containers via CLI (live feeds)
        run: test/acceptance/patch-containers.sh

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Inspect packages
        run: |
          ls -la dist/*.deb dist/*.rpm
          dpkg-deb -c dist/sentrix-agent_*_amd64.deb
          dpkg-deb -I dist/sentrix-agent_*_amd64.deb

  quickstart:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sentrix:ci --build-arg VERSION=ci --build-arg COMMIT=${GITHUB_SHA::7} .
      - name: README quick start (compose + one-liner, host scanned within 5 minutes)
        run: test/acceptance/quickstart.sh
