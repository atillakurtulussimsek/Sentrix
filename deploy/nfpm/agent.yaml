# Default agent configuration installed by the package (not overwritten on upgrade).
# Enrol once with: sudo sentrix-agent --config /etc/sentrix/agent.yaml enroll --server URL --token T --ca-fingerprint FP
state_dir: /var/lib/sentrix-agent
interval: 10s
send_interval: 30s
allow_patching: true
# Package installs are updated by apt/dnf; do not let the agent replace its own binary.
allow_self_update: false
